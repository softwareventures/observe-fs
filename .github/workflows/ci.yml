name: CI
on: [push, pull_request]
env:
  CI: true
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  NPM_TOKEN: ${{secrets.NPM_TOKEN}}
  DEPLOY_NODE_VERSION: 25.x
jobs:
  test:
    name: Test
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x, 25.x]
    steps:
      - name: git checkout
        uses: actions/checkout@v4
      - name: yarn cache
        uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: ${{runner.os}}-node${{matrix.node-version}}-yarn-${{hashFiles('**/yarn.lock')}}
          restore-keys: ${{runner.os}}-node${{matrix.node-version}}-yarn-
      - name: Set up Node.js v${{matrix.node-version}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
      - run: corepack yarn
      - run: corepack yarn test
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@v4
      - name: yarn cache
        uses: actions/cache@v5
        with:
          path: ~/.yarn/berry/cache
          key: ${{runner.os}}-node${{env.DEPLOY_NODE_VERSION}}-yarn-${{hashFiles('**/yarn.lock')}}
          restore-keys: ${{runner.os}}-node${{env.DEPLOY_NODE_VERSION}}-yarn-
      - name: Set up Node.js v${{env.DEPLOY_NODE_VERSION}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{env.DEPLOY_NODE_VERSION}}
      - run: corepack yarn
      - run: corepack yarn lint
